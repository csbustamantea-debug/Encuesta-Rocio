
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Cuánto me conoces? ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <div class="heart">❤️</div>
            <h1>¿Cuánto me conoces?</h1>
            <p>Un pequeño reto creado especialmente para ti.</p>
        </header>

        <section id="bienvenida">
            <label for="nombre">¿Que apodo te tengo?</label>
            <input type="text" id="nombre"
                   placeholder="Escribe tu nombre">

            <button id="comenzar">Comenzar el juego ❤️</button>
        </section>

        <form id="formulario" class="oculto">

            <div id="preguntas"></div>

            <button type="submit">
                Enviar mis respuestas 💌
            </button>

        </form>

        <section id="resultado" class="oculto">
            <h2>¡Terminamos! ❤️</h2>
            <p id="mensaje"></p>
            <h3 id="puntuacion"></h3>

            <button id="compartir">
                Compartir resultado por WhatsApp
            </button>
        </section>

        <footer>
            Hecho con ❤️ para alguien especial
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
